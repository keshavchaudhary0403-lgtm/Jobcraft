    <span>Sends to</span>
    <select id="target"><option value="live">jobcraft-sooty.vercel.app</option><option value="local">localhost:3000 (testing)</option></select>
  </footer>
  <script src="extract.js"></script>
  <script src="sidepanel.js"></script>
