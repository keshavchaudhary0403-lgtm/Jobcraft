<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { --brand:#0a5aa8; --side:#004e98; --soft:#e6eef8; --ink:#16233a; --muted:#4b586d; --faint:#636f84; --line:#e4e8ef; --clay:#ff6700; --good:#1f9d61; --good-soft:#e7f7ee; --bad:#d92d20; --bad-soft:#fdecea; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 360px; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: #f1f3f7; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: linear-gradient(135deg, #0a5aa8, #004e98); color: #fff; }
  header img { width: 28px; height: 28px; border-radius: 50%; background: #fff; }
  header b { font-size: 15px; } header span { display: block; font-size: 12px; opacity: .85; }
  main { padding: 14px 16px 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  .row { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; }
  .row label { width: 72px; flex-shrink: 0; color: var(--faint); font-size: 12px; }
  .row input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; font: inherit; color: var(--ink); }
  .row input:focus { outline: 2px solid var(--soft); border-color: var(--brand); }
  .jd { margin-top: 8px; max-height: 110px; overflow: hidden; color: var(--muted); font-size: 12.5px; white-space: pre-line; position: relative; }
  .jd::after { content: ""; position: absolute; inset: auto 0 0 0; height: 32px; background: linear-gradient(transparent, #fff); }
  .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
  .ok { background: var(--good-soft); color: var(--good); } .warn { background: #fff1e3; color: #b54700; } .bad { background: var(--bad-soft); color: var(--bad); }
  button { font: inherit; border: 0; cursor: pointer; }
  .send { margin-top: 12px; width: 100%; height: 42px; border-radius: 999px; background: var(--clay); color: #fff; font-weight: 600; font-size: 14.5px; }
  .send:disabled { opacity: .45; cursor: default; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .foot { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  select { border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px; font: inherit; font-size: 12px; color: var(--muted); background: #fff; }
  .hint { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--soft); color: var(--side); font-size: 12.5px; }
</style>
</head>
<body>
  <header><img src="icons/icon-48.png" alt="" /><div><b>Send this job to Jobcraft</b><span>You check it there before it's added</span></div></header>
  <main id="app"><div class="muted">Reading this page...</div></main>
  <script src="extract.js"></script>
  <script src="popup.js"></script>
</body>
</html>
